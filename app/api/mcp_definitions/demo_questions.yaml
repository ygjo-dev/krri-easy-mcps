# MCP 상세 「AI에게 이렇게 물어보세요」 예제 질문 (= 「AI로 사용해보기」 고정 질문). 이 파일 하나가 source of truth 다.
#
# 실행 contract 가 아니다. 실행 시 BFF 는 display_text 만 agentic_ai 기존
# POST /chat/stream 에 발화로 보낸다 (context 없음). Resolve 는 agentic_ai 가 한다.
#
#   mcp_id              이 질문을 보여 줄 logical MCP (상세 화면 하나). 개발 중 MCP 는 안 된다
#   expected_recipe_id  resolve 가 이 recipe 를 골랐는지 검증·설명하기 위한 값.
#                       **없으면 「예시」만이다**: agentic_ai 에 이 MCP 를 쓰는 recipe 가 아직 없어서 EASY 의
#                       「AI로 사용해보기」로 실행하지 않는다 (화면은 실행 버튼 없이 보이고 execute 는 409)
#   expected_mcp_ids    실행이 거칠 것으로 예상하는 logical MCP. mcp_id 를 포함한다.
#                       한 recipe 가 여러 MCP 의 Tool 을 쓸 수 있다 (부산역 = 위치 + 행정구역)
#   expected_tools      이 질문이 대표하는 Tool (server_id/tool, 호출 순서대로). 실행 질문은 검증·설명용,
#                       예시는 「이 질문이 부르게 될 Tool」 기록이다
#
# 고르는 규칙 (2026-10-02)
#   - 화면 기본 예제는 그 MCP 의 대표 Tool 하나를 부르는 질문이다. 장소 이름을 좌표로 받는 Tool
#     (CCTV · 좌표의 행정구역 · 도달권 …)은 지도/위치 검색 geo.geocode 를 앞에 한 번 거친다 — 장소를 말로 할 때의 도우미다.
#   - 여러 MCP 를 함께 쓰는 recipe(철도 구간+CCTV, 행정구역+인구 연령·추이)의 질문은 기본 예제로 쓰지 않았다.
#   - 지도 문맥(찍은 지점 · 보이는 범위)이 있어야 닿는 평가 질문은 쓰지 않았다 (EASY 데모는 context 를 보내지 않는다).
#   - 쓰기 Tool(knowledge.deleteDoc · bim.updateModel · bim.deleteModel)을 부르는 질문은 만들지 않는다.
#
# 출처 (case 번호는 agentic_ai dev/evaluation/inputs/test_suites/ 의 정답표)
#   v1 #n   test_suite_v1.yaml case n 의 발화를 그대로 옮겼다. 공식 기준 run 20260922-163007 에서 48/48 통과
#   v2 #n   test_suite_v2.yaml case n 의 발화를 그대로 옮겼다. 공식 기준 run 20260922-163313 에서 그 case 통과
#   새로     agentic_ai 에 맞는 recipe 가 없어 KRRI_ASAP Gateway 의 Tool 설명 · inputSchema(2026-10-02 live)를 보고 새로 썼다
# expected_tools 는 해당 recipe 의 execution.workflow 에서 읽었다 (KRRI_Ontology_Registry/recipes, agentic_ai 8247eff).
# expected_* 는 브라우저로 내보내지 않는다. expected_mcp_ids 는 실행 단계의 Tool 옆에 MCP 이름을 붙이는 데만 쓴다.
questions:
  # ── 지도/위치 검색 ──
  - question_id: iksan-station-location     # v1 #1
    mcp_id: krri-map-location
    display_text: 익산역 위치 보여줘
    expected_recipe_id: recipe_001
    expected_mcp_ids: [krri-map-location]
    expected_tools: [asap-mcp-core/geo.geocode]
    enabled: true
  # v2 #5 「국립중앙박물관 좌표만 줘」는 2026-10-02 실행에서 다른 곳(춘천) 좌표가 나와 빼고 v2 #3 으로 바꿨다
  - question_id: cheongju-airport-location  # v2 #3
    mcp_id: krri-map-location
    display_text: 청주국제공항 위치만 짚어줘
