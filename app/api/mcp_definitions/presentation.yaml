# Portal 전용 사용자-facing 표시 정보. mcp_id(= Gateway market group id)로 technical catalog 와 join 한다.
#
# MCP 단위 · 소속 Tool 의 source of truth 는 Gateway tool-groups.json 이다 (여기서 group 을 만들지 않는다).
# 여기에는 Portal 화면 표시만 둔다. display_name · summary 를 비우면 Gateway group 의 name · description 을 쓴다.
# category 는 Portal 분류다 (Gateway category 는 ASAP-web market tab 값이라 쓰지 않는다).
# 순서는 Catalog 순서다. 여기 없는 Gateway group 은 뒤에 id 순으로, 분류 「기타」로 붙는다.
#
# 여기에 두지 않는 것: internal/Gateway endpoint, credential, Authorization header,
# raw tools/list, tool schema, physical server id.
